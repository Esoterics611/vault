version: '3.8'

services:
  # PRE Proxy Service
  pre-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pre-proxy-service
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3001
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-digitalvault_pre}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - RPC_URL=${RPC_URL}
      - CHAIN_ID=${CHAIN_ID:-84532}
      - CONTENT_REGISTRY_ADDRESS=${CONTENT_REGISTRY_ADDRESS}
      - REKEY_REGISTRY_ADDRESS=${REKEY_REGISTRY_ADDRESS}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-900000}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-100}
      - RATE_LIMIT_REENCRYPT_MAX=${RATE_LIMIT_REENCRYPT_MAX:-50}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - MAX_CAPSULE_SIZE=${MAX_CAPSULE_SIZE:-1048576}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - pre-proxy-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/proxy/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: pre-proxy-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:-digitalvault_pre}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - pre-proxy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  pre-proxy-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
