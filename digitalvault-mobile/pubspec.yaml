name: digitalvault_mobile
description: DigitalVault - Decentralized content ownership platform for creators
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0

  # Web3 & Blockchain
  web3dart: ^2.7.0
  walletconnect_flutter_v2: ^2.1.0
  bip39: ^1.0.6
  ed25519_hd_key: ^2.2.0
  hex: ^0.2.0

  # Storage & Security
  flutter_secure_storage: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2

  # Encryption
  pointycastle: ^3.7.3
  cryptography: ^2.5.0
  crypto: ^3.0.3

  # Media
  image_picker: ^1.0.4
  # file_picker: ^6.1.1  # Disabled - build issues, not needed for Week 17
  video_player: ^2.8.1
  camera: ^0.10.5+5
  image: ^4.1.3
  video_compress: ^3.1.2

  # HTTP & API
  http: ^1.1.0
  dio: ^5.3.3

  # IPFS
  # Note: Use custom IPFS gateway API

  # UI Components
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  fl_chart: ^0.65.0
  shimmer: ^3.0.0
  lottie: ^2.7.0
  cached_network_image: ^3.3.0

  # QR Code
  qr_flutter: ^4.1.0
  # qr_code_scanner: ^1.0.1  # Disabled - build issues, not currently used

  # Utilities
  intl: ^0.18.1
  url_launcher: ^6.2.1
  share_plus: ^7.2.1
  path_provider: ^2.1.1
  open_filex: ^4.3.4
  permission_handler: ^11.0.1
  connectivity_plus: ^5.0.1
  device_info_plus: ^9.1.0

  # Biometrics
  local_auth: ^2.1.7

  # Notifications
  # firebase_core: ^2.24.0  # Disabled for Week 17
  # firebase_messaging: ^14.7.5  # Disabled for Week 17
  # flutter_local_notifications: ^16.2.0  # Disabled - build issues

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  riverpod_generator: ^2.3.0
  hive_generator: ^2.0.1
  mockito: ^5.4.3
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
    - assets/abis/

  fonts:
    - family: DigitalVault
      fonts:
        - asset: assets/fonts/DigitalVault-Regular.ttf
        - asset: assets/fonts/DigitalVault-Bold.ttf
          weight: 700
